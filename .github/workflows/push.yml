name: GHA demo push
run-name: GHA demo push run name
on:
  push:
    branches:
      - main
jobs:

  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Debug test
        run: |
          echo GO_VERSION: $GO_VERSION
        env:
          GO_VERSION: '1.23.2'

      - name: Setup Go
        uses: actions/setup-go@v4
        # `with` is a dictionary that will make it's key available as env vars prefixing with "INPUT_", eg: INPUT_GO_VERSION
        # the input params must be defined by the action called
        with:
          go-version: '1.23.2'

      - name: Build
        run: go build main.go

      - name: Test
        run: go test ./...